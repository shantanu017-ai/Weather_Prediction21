version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: gp01-prod-postgis
    restart: always
    environment:
      POSTGRES_DB: airquality_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisProductionPassword123!}
    volumes:
      - prod_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airquality_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: gp01-prod-ml-service
    restart: always
    environment:
      - PORT=8000
    expose:
      - "8000"

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-node/Dockerfile
    container_name: gp01-prod-api-gateway
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ChangeThisProductionPassword123!}@postgis:5432/airquality_db
      - ML_SERVICE_URL=http://ml-service:8000/ml/v1
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      postgis:
        condition: service_healthy
      ml-service:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gp01-prod-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  prod_postgis_data:
