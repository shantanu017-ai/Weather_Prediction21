# ==============================================================================
# GP-01: AIR QUALITY MONITORING & SOURCE ATTRIBUTION PLATFORM
# Render Infrastructure Blueprint (render.yaml)
# ==============================================================================

services:
  # 1. Python FastAPI ML Service
  - type: web
    name: gp01-ml-service
    env: python
    region: singapore
    plan: free
    rootDir: apps/ml-service
    buildCommand: "pip install -r requirements.txt && python training/train_models.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.10.13

  # 2. Node.js REST API Gateway
  - type: web
    name: gp01-api-gateway
    env: node
    region: singapore
    plan: free
    rootDir: apps/api-node
    buildCommand: "npm install && npm run build"
    startCommand: "node dist/index.js"
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: gp01-ml-service
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: gp01-postgis-db
          property: connectionString
      - key: OPENAQ_API_KEY
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false

databases:
  # 3. PostgreSQL Database (Supports PostGIS extension)
  - name: gp01-postgis-db
    region: singapore
    plan: free
    databaseName: airquality_db
    user: postgres
